<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Henshy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      text-align: center;
    }
    .container { max-width: 300px; }
    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top: 4px solid #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background-color: #444; }
    #stores { display: none; }
  </style>
  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    const PLAY_STORE = "https://play.google.com/store/apps/details?id=com.henshy.app";
    const APP_STORE = "https://apps.apple.com/app/id1234567890"; // غيّر الـ App Store ID هنا
    const deepLink = `henshy://app/products/${productId}`;

    const ua = navigator.userAgent || "";
    const isAndroid =
      /android/i.test(ua) ||
      (navigator.userAgentData && navigator.userAgentData.platform === "Android");
    const isIOS =
      /iphone|ipad|ipod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    let fallbackTimer = null;

    // لو التطبيق اتفتح (الصفحة اتخفت) نلغي التحويل للمتجر
    function cancelFallback() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) cancelFallback();
    });
    window.addEventListener("pagehide", cancelFallback);
    window.addEventListener("blur", cancelFallback);

    function openApp() {
      if (isAndroid) {
        // Intent: بيفتح التطبيق، ولو مش متثبت بيروح للـ Play Store تلقائي
        const intent =
          `intent://app/products/${productId}` +
          `#Intent;scheme=henshy;package=com.henshy.app;` +
          `S.browser_fallback_url=${encodeURIComponent(PLAY_STORE)};end`;
        window.location = intent;
      } else if (isIOS) {
        window.location = deepLink;
        fallbackTimer = setTimeout(() => {
          window.location = APP_STORE;
        }, 1500);
      } else {
        // كمبيوتر أو جهاز مش معروف: نعرض الروابط بدل تحويل غلط
        document.getElementById("stores").style.display = "block";
      }
    }

    window.addEventListener("load", () => {
      if (!isAndroid && !isIOS) {
        document.getElementById("stores").style.display = "block";
        return;
      }
      setTimeout(openApp, 500);
    });
  </script>
</head>
<body>
  <div class="container">
    <img src="https://myvmwawjbuitapdwpaly.supabase.co/storage/v1/object/public/images/pergandy%20Words.webp" alt="Logo" style="width: 290px;">
    <h4>Henshy app is currently opening.</h4>
    <div class="spinner"></div>
    <p>Redirecting... If it doesn't happen automatically, you can click the button below.</p>
    <button class="btn" onclick="openApp()">Open in App</button>

    <div id="stores">
      <p>Download the app:</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.henshy.app">Google Play</a>
      <a class="btn" href="https://apps.apple.com/app/id1234567890">App Store</a>
    </div>
  </div>
</body>
</html>
